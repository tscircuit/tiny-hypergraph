63.7362637363258" fill="rgba(37, 99, 235, 0.16)" stroke="#2563eb" stroke-width="0.0004549999999998785"/></g><text data-type="text" data-label="PMP22650 0.0068 mm cramped boundary: 10 graph lanes" data-x="256.400400985" data-y="128.3426" x="241.75824175821617" y="191.42857142852154" fill="black" font-size="6.593406593408604" font-family="sans-serif" text-anchor="end" dominant-baseline="text-before-edge">PMP22650 0.0068 mm cramped boundary: 10 graph lanes</text><g><circle data-type="point" data-label="lane 1" data-x="256.48340098499995" data-y="128.2826" cx="424.1758241758216" cy="323.29670329671353" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="lane 2" data-x="256.48340098499995" data-y="128.2876" cx="424.1758241758216" cy="312.30769230768783" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="lane 3" data-x="256.48340098499995" data-y="128.2926" cx="424.1758241758216" cy="301.31868131872034" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="lane 4" data-x="256.48340098499995" data-y="128.2976" cx="424.1758241758216" cy="290.32967032969464" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="lane 5" data-x="256.48340098499995" data-y="128.3026" cx="424.1758241758216" cy="279.3406593406107" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="lane 6" data-x="256.48340098499995" data-y="128.3076" cx="424.1758241758216" cy="268.35164835164323" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="lane 7" data-x="256.48340098499995" data-y="128.3126" cx="424.1758241758216" cy="257.36263736261753" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="lane 8" data-x="256.48340098499995" data-y="128.3176" cx="424.1758241758216" cy="246.37362637359183" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="lane 9" data-x="256.48340098499995" data-y="128.3226" cx="424.1758241758216" cy="235.38461538462434" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="lane 10" data-x="256.48340098499995" data-y="128.3276" cx="424.1758241758216" cy="224.39560439559864" r="3" fill="#111827"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":2197.8021978027846,"c":0,"e":-563275.60656059,"b":0,"d":-2197.8021978027846,"f":282263.0769231522};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>