6.08019936,122.79325680285714" data-type="line" data-label="duplicate 6" points="40.00000000005821,294.9999499998812 600.0000000000582,294.9999499998812" fill="none" stroke="hsl(308.57142857142856 75% 45%)" stroke-width="5.600011200022849"/></g><g><rect data-type="rect" data-label="PMP22650 capacity-mesh node" data-x="265.88019976" data-y="122.77539966" x="40.00000000005821" y="235.9998319996521" width="559.9999999998836" height="168.00033600069582" fill="rgba(80, 140, 220, 0.12)" stroke="rgb(80, 140, 220)" stroke-width="0.0007142842857142285"/></g><g><circle data-type="point" data-label="duplicate 0" data-x="265.68020016" data-y="122.75039966" cx="40.00000000005821" cy="355.00007000015466" r="3" fill="rgb(20, 20, 20)"/></g><g><circle data-type="point" data-label="duplicate 1" data-x="265.68020016" data-y="122.75754251714285" cx="40.00000000005821" cy="345.0000500001188" r="3" fill="rgb(20, 20, 20)"/></g><g><circle data-type="point" data-label="duplicate 2" data-x="265.68020016" data-y="122.76468537428572" cx="40.00000000005821" cy="335.0000300000538" r="3" fill="rgb(20, 20, 20)"/></g><g><circle data-type="point" data-label="duplicate 3" data-x="265.68020016" data-y="122.77182823142857" cx="40.00000000005821" cy="325.00001000001794" r="3" fill="rgb(20, 20, 20)"/></g><g><circle data-type="point" data-label="duplicate 4" data-x="265.68020016" data-y="122.77897108857142" cx="40.00000000005821" cy="314.99998999998206" r="3" fill="rgb(20, 20, 20)"/></g><g><circle data-type="point" data-label="duplicate 5" data-x="265.68020016" data-y="122.78611394571429" cx="40.00000000005821" cy="304.9999699999171" r="3" fill="rgb(20, 20, 20)"/></g><g><circle data-type="point" data-label="duplicate 6" data-x="265.68020016" data-y="122.79325680285714" cx="40.00000000005821" cy="294.9999499998812" r="3" fill="rgb(20, 20, 20)"/></g><g><circle data-type="point" data-label="duplicate 0" data-x="266.08019936" data-y="122.75039966" cx="600.0000000000582" cy="355.00007000015466" r="3" fill="rgb(20, 20, 20)"/></g><g><circle data-type="point" data-label="duplicate 1" data-x="266.08019936" data-y="122.75754251714285" cx="600.0000000000582" cy="345.0000500001188" r="3" fill="rgb(20, 20, 20)"/></g><g><circle data-type="point" data-label="duplicate 2" data-x="266.08019936" data-y="122.76468537428572" cx="600.0000000000582" cy="335.0000300000538" r="3" fill="rgb(20, 20, 20)"/></g><g><circle data-type="point" data-label="duplicate 3" data-x="266.08019936" data-y="122.77182823142857" cx="600.0000000000582" cy="325.00001000001794" r="3" fill="rgb(20, 20, 20)"/></g><g><circle data-type="point" data-label="duplicate 4" data-x="266.08019936" data-y="122.77897108857142" cx="600.0000000000582" cy="314.99998999998206" r="3" fill="rgb(20, 20, 20)"/></g><g><circle data-type="point" data-label="duplicate 5" data-x="266.08019936" data-y="122.78611394571429" cx="600.0000000000582" cy="304.9999699999171" r="3" fill="rgb(20, 20, 20)"/></g><g><circle data-type="point" data-label="duplicate 6" data-x="266.08019936" data-y="122.79325680285714" cx="600.0000000000582" cy="294.9999499998812" r="3" fill="rgb(20, 20, 20)"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":1400.0028000057123,"c":0,"e":-371913.0241300781,"b":0,"d":-1400.0028000057123,"f":172205.90329582038};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>