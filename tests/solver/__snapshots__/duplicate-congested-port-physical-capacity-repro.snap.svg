06773862692054 0.05,-0.0606773862692054" data-type="line" data-label="lane 7: physical trace" points="547.7818221797975,597.4804785842031 588.1261695141229,597.4804785842031" fill="none" stroke="rgb(210, 45, 45)" stroke-width="40.9898568916747"/></g><g><rect data-type="rect" data-label="left region" data-x="-0.1999996" data-y="0.94560191247129" x="467.09334268099894" y="53.65853658536594" width="107.58471105501553" height="546.3414634146341" fill="rgba(80, 140, 220, 0.16)" stroke="rgb(80, 140, 220)" stroke-width="0.0037179929757440414"/></g><g><rect data-type="rect" data-label="right region" data-x="0.011800205" data-y="0" x="574.6780537360145" y="562.3211879891347" width="6.347620921816542" height="37.678720563685374" fill="rgba(80, 140, 220, 0.16)" stroke="rgb(80, 140, 220)" stroke-width="0.0037179929757440414"/></g><text data-type="text" data-label="PMP22650 opening: 7 graph lanes / 1 physical lane" data-x="-0.45078154308333324" data-y="1.9612487741379547" x="453.4348060956331" y="53.65853658536594" fill="black" font-size="13.658536585365852" font-family="sans-serif" text-anchor="end" dominant-baseline="text-before-edge">PMP22650 opening: 7 graph lanes / 1 physical lane</text><g><circle data-type="point" data-label="lane 1" data-x="0" data-y="-0.07004460919540242" cx="574.6780537360145" cy="599.9999085528201" r="3" fill="rgb(20, 20, 20)"/></g><g><circle data-type="point" data-label="lane 2" data-x="0.006970154287564787" data-y="-0.06848340537436959" cx="576.5527625730235" cy="599.5800035580506" r="3" fill="rgb(20, 20, 20)"/></g><g><circle data-type="point" data-label="lane 3" data-x="0.013940308575129574" data-y="-0.06692220155333675" cx="578.4274714100325" cy="599.1600985632812" r="3" fill="rgb(20, 20, 20)"/></g><g><circle data-type="point" data-label="lane 4" data-x="0.020910462862694365" data-y="-0.06536099773230392" cx="580.3021802470415" cy="598.7401935685116" r="3" fill="rgb(20, 20, 20)"/></g><g><circle data-type="point" data-label="lane 5" data-x="0.02788061715025915" data-y="-0.06379979391127108" cx="582.1768890840506" cy="598.3202885737421" r="3" fill="rgb(20, 20, 20)"/></g><g><circle data-type="point" data-label="lane 6" data-x="0.03485077143782393" data-y="-0.062238590090238244" cx="584.0515979210595" cy="597.9003835789727" r="3" fill="rgb(20, 20, 20)"/></g><g><circle data-type="point" data-label="lane 7" data-x="0.04182092572538873" data-y="-0.0606773862692054" cx="585.9263067580686" cy="597.4804785842031" r="3" fill="rgb(20, 20, 20)"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":268.9623155621699,"c":0,"e":574.6780537360145,"b":0,"d":-268.9623155621699,"f":581.1605482709774};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>