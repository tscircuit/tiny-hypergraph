name: Tiny Hypergraph Benchmark

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dataset_name:
        description: "Dataset to benchmark: hg07 or srj18"
        required: false
        type: string
      limit:
        description: "Run the first N samples"
        required: false
        type: string
      sample:
        description: "Run one sample by number or name"
        required: false
        type: string
      solver:
        description: "Solver variant: core or poly"
        required: false
        type: string
      families:
        description: "Candidate families preset/list: default, default+deep, all, or comma-separated"
        required: false
        type: string
      concurrency:
        description: 'Benchmark concurrency value, or "auto"'
        required: false
        type: string
      ref:
        description: "Git ref (branch, tag, or SHA) to benchmark"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  benchmark:
    name: Run benchmark
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'push' &&
        github.ref_name == 'main'
      ) || (
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.title, '[BENCHMARK TEST]')
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.type != 'Bot' &&
        startsWith(github.event.comment.body, '/benchmark') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ${{ vars.BENCHMARK_RUNNER || 'blacksmith-32vcpu-ubuntu-2404-arm' }}
    timeout-minutes: ${{ github.event_name == 'issue_comment' && 120 || 60 }}

    steps:
      - name: Checkout benchmark controller
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          path: benchmark-controller
          persist-credentials: false

      - name: Parse benchmark command
        id: parse
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN || github.token }}
          script: |
            let benchmarkArgs = []
            let ref = context.sha
            let statusCommentId = ''
            let baseSha = ''
            let prSha = ''

            if (context.eventName === 'issue_comment') {
              const { pathToFileURL } = require('node:url')
              const parserUrl = pathToFileURL(
                `${process.env.GITHUB_WORKSPACE}/benchmark-controller/scripts/benchmarking/pr-benchmark-command.js`,
              ).href
              const { parsePrBenchmarkCommand } = await import(parserUrl)
              const command = parsePrBenchmarkCommand(context.payload.comment.body)
              benchmarkArgs = command.benchmarkArgs

              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              })
              baseSha = pr.data.base.sha
              prSha = pr.data.head.sha
              ref = prSha

              try {
                const statusComment = await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `## Tiny Hypergraph Same Machine Benchmark\n\nQueued PR base \`${baseSha.slice(0, 7)}\` and PR head \`${prSha.slice(0, 7)}\`. Both revisions will run sequentially in this Blacksmith job.\n\nWorkflow: [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
                })

                statusCommentId = String(statusComment.data.id)
              } catch (error) {
                core.warning(`Could not create benchmark status comment: ${error.message}`)
              }
            }

            if (context.eventName === 'workflow_dispatch') {
              const inputs = context.payload.inputs || {}
              const datasetName = (inputs.dataset_name || '').trim()
              const limit = (inputs.limit || '').trim()
              const sample = (inputs.sample || '').trim()
              const solver = (inputs.solver || '').trim()
              const families = (inputs.families || '').trim()
              const concurrency = (inputs.concurrency || '').trim()

              if (datasetName) benchmarkArgs.push('--dataset', datasetName)
              if (limit) benchmarkArgs.push('--limit', limit)
              if (sample) benchmarkArgs.push('--sample', sample)
              if (solver) benchmarkArgs.push('--solver', solver)
              if (families) benchmarkArgs.push('--families', families)
              if (concurrency) benchmarkArgs.push('--concurrency', concurrency)

              ref = (inputs.ref || '').trim() || ref
            }

            if (context.eventName === 'pull_request') {
              ref = context.payload.pull_request.head.sha
            }

            core.setOutput('benchmark_args_json', JSON.stringify(benchmarkArgs))
            core.setOutput('ref', ref)
            core.setOutput('base_sha', baseSha)
            core.setOutput('pr_sha', prSha)
            core.setOutput('status_comment_id', statusCommentId)

      - name: Checkout code
        if: github.event_name != 'issue_comment'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.parse.outputs.ref }}
          persist-credentials: false

      - name: Checkout PR base
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.parse.outputs.base_sha }}
          path: same-machine-base
          persist-credentials: false

      - name: Checkout PR head
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.parse.outputs.pr_sha }}
          path: same-machine-pr
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: github.event_name != 'issue_comment'
        run: bun install

      - name: Install base dependencies
        if: github.event_name == 'issue_comment'
        working-directory: same-machine-base
        run: bun install

      - name: Install PR dependencies
        if: github.event_name == 'issue_comment'
        working-directory: same-machine-pr
        run: bun install

      - name: Run benchmark
        if: github.event_name != 'issue_comment'
        env:
          BENCHMARK_ARGS_JSON: ${{ steps.parse.outputs.benchmark_args_json }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          chmod +x ./benchmark.sh
          set +e
          node <<'NODE'
          const fs = require('node:fs')
          const { spawnSync } = require('node:child_process')
          const args = JSON.parse(process.env.BENCHMARK_ARGS_JSON || '[]')
          const isMainPush = process.env.GITHUB_EVENT_NAME === 'push' && process.env.GITHUB_REF_NAME === 'main'
          const mainBranchDatasets = ['hg07', 'srj18']

          const withoutDataset = (baseArgs) => {
            const nextArgs = []
            for (let index = 0; index < baseArgs.length; index += 1) {
              if (baseArgs[index] === '--dataset') {
                index += 1
                continue
              }
              nextArgs.push(baseArgs[index])
            }
            return nextArgs
          }

          const withDataset = (baseArgs, datasetName) => [
            ...withoutDataset(baseArgs),
            '--dataset',
            datasetName,
          ]

          const runBenchmark = (benchmarkArgs) => {
            const renderedArgs = benchmarkArgs.map((arg) => JSON.stringify(arg)).join(' ')
            console.log(`Running benchmark command: ./benchmark.sh${renderedArgs ? ` ${renderedArgs}` : ''}`)

            const result = spawnSync('./benchmark.sh', benchmarkArgs, {
              stdio: 'inherit',
              env: process.env,
            })

            if (result.error) throw result.error
            return result.status ?? 1
          }

          if (isMainPush) {
            const reports = []
            const textReports = []
            let status = 0

            for (const datasetName of mainBranchDatasets) {
              status = runBenchmark(withDataset(args, datasetName))
              if (status !== 0) break

              const report = JSON.parse(fs.readFileSync('benchmark-result.json', 'utf8'))
              const text = fs.readFileSync('benchmark-result.txt', 'utf8').trim()
              reports.push(report)
              textReports.push(`## Dataset: ${report.datasetName || datasetName}\n\n${text}`)
            }

            if (reports.length > 0) {
              fs.writeFileSync(
                'benchmark-result.json',
                JSON.stringify(
                  {
                    version: 2,
                    kind: 'benchmark-report-collection',
                    generatedFor: 'main',
                    reports,
                  },
                  null,
                  2,
                ),
              )
              fs.writeFileSync('benchmark-result.txt', `${textReports.join('\n\n---\n\n')}\n`)
            }

            process.exit(status)
          }

          process.exit(runBenchmark(args))
          NODE
          STATUS=$?
          set -e

          if [ -f benchmark-result.txt ]; then
            cp benchmark-result.txt benchmark-result-pr.txt
          fi
          if [ -f benchmark-result.json ]; then
            cp benchmark-result.json benchmark-result-pr.json
          fi

          exit "$STATUS"

      - name: Run same-machine comparison
        if: github.event_name == 'issue_comment'
        env:
          BENCHMARK_ARGS_JSON: ${{ steps.parse.outputs.benchmark_args_json }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const { spawnSync } = require('node:child_process')
          const args = JSON.parse(process.env.BENCHMARK_ARGS_JSON || '[]')
          if (!Array.isArray(args) || args.some((arg) => typeof arg !== 'string')) {
            throw new Error('BENCHMARK_ARGS_JSON must be a JSON array of strings')
          }

          const runRevision = (label) => {
            const directory = `same-machine-${label}`
            const outputDirectory = `same-machine-results/${label}`
            fs.mkdirSync(outputDirectory, { recursive: true })
            fs.chmodSync(path.join(directory, 'benchmark.sh'), 0o755)
            const renderedArgs = args.map((arg) => JSON.stringify(arg)).join(' ')
            console.log(`Running ${label}: ./benchmark.sh${renderedArgs ? ` ${renderedArgs}` : ''}`)
            const result = spawnSync('./benchmark.sh', args, {
              cwd: directory,
              stdio: 'inherit',
              env: process.env,
            })
            if (result.error) throw result.error

            for (const extension of ['txt', 'json']) {
              const source = path.join(directory, `benchmark-result.${extension}`)
              if (!fs.existsSync(source)) continue
              fs.copyFileSync(source, `benchmark-result-${label}.${extension}`)
              fs.copyFileSync(source, path.join(outputDirectory, `benchmark-result.${extension}`))
            }
            const resultsDirectory = path.join(directory, 'results')
            if (fs.existsSync(resultsDirectory)) {
              fs.cpSync(resultsDirectory, path.join(outputDirectory, 'results'), {
                recursive: true,
              })
            }
            return result.status ?? 1
          }

          const baseStatus = runRevision('base')
          const prStatus = runRevision('pr')
          process.exit(baseStatus !== 0 ? baseStatus : prStatus)
          NODE

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-result
          path: |
            benchmark-result.txt
            benchmark-result.json
            benchmark-result-pr.txt
            benchmark-result-pr.json
            benchmark-result-base.txt
            benchmark-result-base.json
            same-machine-results/**
            results/**
          if-no-files-found: ignore

      - name: Update benchmark comment
        if: always() && github.event_name == 'issue_comment' && steps.parse.outputs.status_comment_id != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN || github.token }}
          script: |
            const fs = require('node:fs')
            const { pathToFileURL } = require('node:url')
            const rendererUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/benchmark-controller/scripts/benchmarking/render-pr-comparison.js`,
            ).href
            const { renderBenchmarkComparison } = await import(rendererUrl)
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            const jobStatus = '${{ job.status }}'
            const baseSha = '${{ steps.parse.outputs.base_sha }}'
            const prSha = '${{ steps.parse.outputs.pr_sha }}'
            const runnerName = '${{ runner.name }}'
            const maxLength = 60000

            const readText = (path) =>
              fs.existsSync(path) ? fs.readFileSync(path, 'utf8').trim() : ''

            const readJson = (path) => {
              const raw = readText(path)
              if (!raw) return null
              try {
                return JSON.parse(raw)
              } catch {
                return null
              }
            }

            const escapeHtml = (value) =>
              String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')

            const formatNumber = (value, digits = 3) =>
              typeof value === 'number' && Number.isFinite(value)
                ? value.toFixed(digits)
                : 'n/a'

            const formatTime = (value) =>
              typeof value === 'number' && Number.isFinite(value)
                ? `${(value / 1000).toFixed(3)}s`
                : 'n/a'

            const formatMemory = (byteCount) =>
              typeof byteCount === 'number' && Number.isFinite(byteCount)
                ? `${(byteCount / (1024 * 1024)).toFixed(1)} MiB`
                : 'n/a'

            const formatValue = (value) =>
              value === null || value === undefined || value === ''
                ? 'n/a'
                : escapeHtml(value)

            const truncate = (value, maxLength = 120) => {
              const text = String(value ?? '')
              return text.length <= maxLength ? text : `${text.slice(0, maxLength - 3)}...`
            }

            const renderSamples = (report, options = {}) => {
              if (!Array.isArray(report?.samples) || report.samples.length === 0) {
                return ['Per-sample results unavailable.']
              }

              const samples = options.limit ? report.samples.slice(0, options.limit) : report.samples
              const omittedCount = report.samples.length - samples.length
              return [
                '| Sample | Status | Routes | Baseline | Final | Delta | Hops | Rips | Attempts | Iterations | Duration | Peak Memory | Error |',
                '| --- | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | --- |',
                ...samples.map((sample) => {
                  const firstErrorLine = sample.error ? String(sample.error).split('\n')[0] : ''
                  const routes = `${sample.solvedRouteCount ?? 0}/${sample.connectionCount ?? 0}`
                  return `| ${escapeHtml(sample.sampleName)} | ${escapeHtml(sample.status)} | ${routes} | ${formatNumber(sample.baselineMaxRegionCost)} | ${formatNumber(sample.finalMaxRegionCost)} | ${formatNumber(sample.delta)} | ${formatNumber(sample.avgRouteHops)} | ${sample.requiredRipRouteCount ?? 0} | ${sample.candidateCount ?? 0} | ${sample.iterations ?? 0} | ${formatTime(sample.durationMs)} | ${formatMemory(sample.peakMemoryBytes)} | ${escapeHtml(truncate(firstErrorLine))} |`
                }),
                ...(omittedCount > 0
                  ? ['', `_${omittedCount} additional sample${omittedCount === 1 ? '' : 's'} omitted to keep the comment compact._`]
                  : []),
              ]
            }

            const renderReport = (report, fallbackText, options = {}) => {
              if (!report) {
                return fallbackText
                  ? ['```', fallbackText.slice(0, 8000), '```']
                  : ['(benchmark results were not produced)']
              }

              return [
                '| Metric | Value |',
                '| --- | ---: |',
                `| Dataset | ${formatValue(report.datasetName)} |`,
                `| Source | ${formatValue(report.datasetSource)} |`,
                `| Revision | ${formatValue(report.datasetRevision)} |`,
                `| Sample selection | ${formatValue(report.sampleSelection)} |`,
                `| Solver | ${formatValue(report.solverVariant)} |`,
                `| Families | ${formatValue(report.candidateFamilies)} |`,
                `| Memory measurement | ${report.memoryMeasurement === 'isolated-sample-peak' ? 'isolated per-sample peak' : 'legacy process samples'} |`,
                `| Samples | ${report.sampleCount ?? 'n/a'} |`,
                `| Success rate | ${report.summary?.successRate ?? 'n/a'} |`,
                `| Solved-route completion rate | ${report.summary?.routeCompletionRate ?? 'n/a'} |`,
                `| Improved rate | ${report.summary?.improvedRate ?? 'n/a'} |`,
                `| Zero final max region cost rate | ${report.summary?.zeroFinalCostRate ?? 'n/a'} |`,
                `| Total completion time | ${formatTime(report.summary?.totalDurationMs)} |`,
                `| Avg baseline max region cost | ${formatNumber(report.summary?.avgBaselineMaxRegionCost)} |`,
                `| Avg final max region cost | ${formatNumber(report.summary?.avgFinalMaxRegionCost)} |`,
                `| Avg max region delta | ${formatNumber(report.summary?.avgMaxRegionDelta)} |`,
                `| Avg candidate count | ${formatNumber(report.summary?.avgCandidateCount)} |`,
                `| Avg generated candidate count | ${formatNumber(report.summary?.avgGeneratedCandidateCount)} |`,
                `| Avg duplicate candidate count | ${formatNumber(report.summary?.avgDuplicateCandidateCount)} |`,
                `| Avg iterations | ${formatNumber(report.summary?.avgIterations)} |`,
                `| Avg route hops | ${formatNumber(report.summary?.avgRouteHops)} |`,
                `| Routes requiring rip | ${report.summary?.totalRequiredRipRouteCount ?? 'n/a'} |`,
                `| Avg solveGraph time | ${formatTime(report.summary?.avgSolveGraphMs)} |`,
                `| Avg section search time | ${formatTime(report.summary?.avgSectionSearchMs)} |`,
                `| Avg optimizeSection time | ${formatTime(report.summary?.avgOptimizeSectionMs)} |`,
                `| Avg duration | ${formatTime(report.summary?.avgDurationMs)} |`,
                `| P50 duration | ${formatTime(report.summary?.p50DurationMs)} |`,
                `| P80 duration | ${formatTime(report.summary?.p80DurationMs)} |`,
                `| P95 duration | ${formatTime(report.summary?.p95DurationMs)} |`,
                `| Memory P50 | ${formatMemory(report.summary?.p50RssBytes)} |`,
                `| Memory P80 | ${formatMemory(report.summary?.p80RssBytes)} |`,
                `| Memory P90 | ${formatMemory(report.summary?.p90RssBytes)} |`,
                '',
                ...renderSamples(report, options),
              ]
            }

            const renderDetails = (summary, lines, open = false) => [
              `<details${open ? ' open' : ''}>`,
              `<summary>${summary}</summary>`,
              '',
              ...lines,
              '',
              '</details>',
            ]

            const getBenchmarkReports = (report) => {
              if (Array.isArray(report?.reports)) {
                return report.reports.filter(Boolean)
              }
              return report ? [report] : []
            }

            const selectBaseReportForPr = (baseReport, prReport) => {
              const reports = getBenchmarkReports(baseReport)
              if (reports.length === 0) return null

              const prDatasetName = prReport?.datasetName
              if (!prDatasetName) return reports[0] ?? null

              return reports.find((report) => report?.datasetName === prDatasetName) ?? null
            }

            const getMissingBaseMessage = (baseReport, prReport) => {
              const prDatasetName = prReport?.datasetName
              if (!prDatasetName) return '(the paired benchmark did not produce a base report)'
              const reports = getBenchmarkReports(baseReport)
              if (reports.length === 0) {
                return `(the same-machine base benchmark did not produce a report for dataset ${prDatasetName})`
              }
              const availableDatasets = reports.map((report) => report?.datasetName).filter(Boolean).join(', ')
              return `(the same-machine base report did not match dataset ${prDatasetName}; available datasets: ${availableDatasets || 'none'})`
            }

            const baseText = readText('benchmark-result-base.txt')
            const prText = readText('benchmark-result-pr.txt') || readText('benchmark-result.txt')
            const rawBaseReport = readJson('benchmark-result-base.json')
            const prReport = readJson('benchmark-result-pr.json') || readJson('benchmark-result.json')
            const baseReport = selectBaseReportForPr(rawBaseReport, prReport)
            const baseFallbackText = baseReport
              ? baseText
              : getMissingBaseMessage(rawBaseReport, prReport)
            const comparisonReport = prReport ?? baseReport
            const title = jobStatus === 'success'
              ? '## Tiny Hypergraph Same Machine Benchmark Results'
              : '## Tiny Hypergraph Same Machine Benchmark Failed'

            const renderBody = (options = {}) => [
              title,
              '',
              `Base \`${baseSha.slice(0, 7)}\` and PR \`${prSha.slice(0, 7)}\` ran sequentially on \`${runnerName}\` with identical arguments.`,
              '',
              `Dataset: \`${formatValue(comparisonReport?.datasetName)}\` · Samples: ${comparisonReport?.sampleCount ?? 'n/a'} · Families: \`${formatValue(comparisonReport?.candidateFamilies)}\``,
              '',
              ...renderBenchmarkComparison(baseReport, prReport).split('\n'),
              '',
              ...renderDetails('PR Base Details', renderReport(baseReport, baseFallbackText, options)),
              '',
              ...renderDetails('PR Details', renderReport(prReport, prText, options), true),
              '',
              `Workflow: [View run](${runUrl})`,
              `Artifact: ${runUrl}`,
            ].join('\n')

            const fullBody = renderBody()
            const body = fullBody.length <= maxLength
              ? fullBody
              : renderBody({ limit: 50 })

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number('${{ steps.parse.outputs.status_comment_id }}'),
              body,
            })
