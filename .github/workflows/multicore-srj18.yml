name: Deterministic multicore srj18

on:
  pull_request:
    paths:
      - "lib/parallel/**"
      - "scripts/benchmarking/*srj18*"
      - ".github/workflows/multicore-srj18.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multicore-srj18-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ${{ vars.BENCHMARK_RUNNER || 'blacksmith-32vcpu-ubuntu-2404-arm' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --ignore-scripts
      - name: Require eight CPUs and constrain affinity
        run: |
          python3 - <<'PY'
          import os, pathlib
          cpus = sorted(os.sched_getaffinity(0))
          assert len(cpus) >= 8, f"Only {len(cpus)} CPUs available"
          physical = {}
          for cpu in cpus:
              topology = pathlib.Path(f'/sys/devices/system/cpu/cpu{cpu}/topology')
              key = (topology.joinpath('physical_package_id').read_text().strip(), topology.joinpath('core_id').read_text().strip())
              physical.setdefault(key, cpu)
          assert len(physical) >= 8, f'Only {len(physical)} physical cores available'
          quota = pathlib.Path('/sys/fs/cgroup/cpu.max')
          if quota.exists():
              maximum, period = quota.read_text().split()
              assert maximum == 'max' or int(maximum) / int(period) >= 8, 'CPU quota below eight'
          quota_v1 = pathlib.Path('/sys/fs/cgroup/cpu/cpu.cfs_quota_us')
          period_v1 = pathlib.Path('/sys/fs/cgroup/cpu/cpu.cfs_period_us')
          if quota_v1.exists() and period_v1.exists():
              maximum, period = int(quota_v1.read_text()), int(period_v1.read_text())
              assert maximum < 0 or maximum / period >= 8, 'CPU quota below eight'
          affinity = ','.join(map(str, list(physical.values())[:8]))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'BENCHMARK_CPUS={affinity}\n')
          print(f'Benchmark affinity: {affinity}; quota: {quota.read_text() if quota.exists() else "unavailable"}')
          PY
      - name: Unpack pinned autorouter hypergraph inputs
        run: |
          mkdir -p work
          tar -xzf experiments/srj18-inputs.tar.gz -C work
      - name: Verify reproducible native kernel
        run: |
          cp lib/parallel/native-route-search.wasm work/committed-kernel.wasm
          bun run build:native-search
          cmp lib/parallel/native-route-search.wasm work/committed-kernel.wasm
      - name: Benchmark persistent workers with sequential graphs
        run: taskset -c "$BENCHMARK_CPUS" bun scripts/benchmarking/pooled-portfolio-srj18.ts --workers 1,8 --repeat 3 --out work/eight-core-pooled-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pooled-multicore-srj18
          path: work/eight-core-pooled-results.json
      - name: Measure cold per-graph startup separately
        run: taskset -c "$BENCHMARK_CPUS" bun scripts/benchmarking/fixed-round-srj18.ts --portfolio --workers 1,8 --repeat 1 --out work/eight-core-portfolio-results.json
      - name: Measure full-budget reference mode
        run: taskset -c "$BENCHMARK_CPUS" bun scripts/benchmarking/pooled-portfolio-srj18.ts --baseline-budget 1000000 --workers 1,8 --repeat 1 --out work/eight-core-reference-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multicore-srj18
          path: work/eight-core*-results.json
